services:
  dingtalk-bot:
    build:
      context: .
      dockerfile: Dockerfile.logistics
      args:
        # Server proxy: sing-box on host :20171 (see deploy/deploy.env.example)
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        http_proxy: ${BUILD_HTTP_PROXY:-}
        https_proxy: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1}
        no_proxy: ${BUILD_NO_PROXY:-localhost,127.0.0.1}
    image: dingtalk-bot:latest
    container_name: dingtalk-bot
    restart: unless-stopped
    env_file:
      - path: ./apps/logistics_bot/.env
        required: false
      - path: ./apps/cp_bot/.env
        required: false
      - path: ./apps/split_bot/.env
        required: false
      - path: ./apps/pinxiang_bot/.env
        required: false
      - path: ./apps/track_notify/.env
        required: false
    environment:
      TZ: Asia/Shanghai
      # Clear build-time proxy if baked into image (OSS/DingTalk downloads must be direct)
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: ""
      no_proxy: ""
      # 同步文件统一目录：宿主机 ./files → 容器 /app/files
      ADDRESS_BOOK_XLSX_PATH: /app/files/全站点地址.xlsx
      PINXIANG_PRODUCT_INFO_PATH: /app/files/产品信息单证专用.xlsx
      PINXIANG_WORKSPACE: /app/apps/pinxiang_bot/.bot-workspace
      LCL_BASE_DIR: /app/apps/lcl_bot
      TRACK_NOTIFY_STATE_DIR: /app/apps/track_notify/.state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Source mounts: rsync + restart, no image rebuild for app code
      - ./shared:/app/shared:ro
      - ./apps/logistics_bot:/app/apps/logistics_bot
      - ./apps/cp_bot:/app/apps/cp_bot
      - ./apps/split_bot:/app/apps/split_bot
      - ./apps/pinxiang_bot:/app/apps/pinxiang_bot
      - ./apps/lcl_bot:/app/apps/lcl_bot
      - ./apps/track_notify:/app/apps/track_notify
      - ./files:/app/files:ro
      - ./apps/cp_bot/downloads:/app/apps/cp_bot/downloads
      - ./apps/split_bot/.bot-workspace:/app/apps/split_bot/.bot-workspace
      - ./apps/pinxiang_bot/.bot-workspace:/app/apps/pinxiang_bot/.bot-workspace
      - ./apps/lcl_bot/Excel_Files:/app/apps/lcl_bot/Excel_Files
      - ./apps/lcl_bot/Workflow_State:/app/apps/lcl_bot/Workflow_State
      - ./apps/logistics_bot/.state:/app/apps/logistics_bot/.state
      - ./apps/track_notify/.state:/app/apps/track_notify/.state
    command: ["python", "apps/logistics_bot/main.py"]

  dingtalk-cp-bot:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile.cp
    image: dingtalk-cp-bot:latest
    container_name: dingtalk-cp-bot
    restart: unless-stopped
    env_file:
      - path: ./apps/cp_bot/.env
        required: false
    environment:
      TZ: Asia/Shanghai
      ADDRESS_BOOK_XLSX_PATH: /app/files/全站点地址.xlsx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/cp_bot/downloads:/app/downloads
      - ./files:/app/files:ro
    command: ["python", "app.py"]

  dingtalk-split-bot:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile.split
    image: dingtalk-split-bot:latest
    container_name: dingtalk-split-bot
    restart: unless-stopped
    env_file:
      - path: ./apps/split_bot/.env
        required: false
    volumes:
      - ./apps/split_bot/.bot-workspace:/app/.bot-workspace
