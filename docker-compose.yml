services:
  dingtalk-bot:
    build:
      context: .
      dockerfile: Dockerfile.logistics
    image: dingtalk-bot:latest
    container_name: dingtalk-bot
    restart: unless-stopped
    env_file:
      - path: ./apps/logistics_bot/.env
        required: false
      - path: ./apps/cp_bot/.env
        required: false
      - path: ./apps/split_bot/.env
        required: false
      - path: ./apps/pinxiang_bot/.env
        required: false
    environment:
      TZ: Asia/Shanghai
      # 同步文件统一目录：宿主机 ./files → 容器 /app/files
      ADDRESS_BOOK_XLSX_PATH: /app/files/全站点地址.xlsx
      PINXIANG_PRODUCT_INFO_PATH: /app/files/产品信息单证专用.xlsx
      PINXIANG_WORKSPACE: /app/apps/pinxiang_bot/.bot-workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./files:/app/files:ro
      - ./apps/cp_bot/downloads:/app/apps/cp_bot/downloads
      - ./apps/split_bot/.bot-workspace:/app/apps/split_bot/.bot-workspace
      - ./apps/pinxiang_bot/.bot-workspace:/app/apps/pinxiang_bot/.bot-workspace
      - ./apps/pinxiang_bot/templates:/app/apps/pinxiang_bot/templates:ro
      - ./apps/logistics_bot/.state:/app/apps/logistics_bot/.state
    command: ["python", "apps/logistics_bot/main.py"]

  dingtalk-cp-bot:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile.cp
    image: dingtalk-cp-bot:latest
    container_name: dingtalk-cp-bot
    restart: unless-stopped
    env_file:
      - path: ./apps/cp_bot/.env
        required: false
    environment:
      TZ: Asia/Shanghai
      ADDRESS_BOOK_XLSX_PATH: /app/files/全站点地址.xlsx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/cp_bot/downloads:/app/downloads
      - ./files:/app/files:ro
    command: ["python", "app.py"]

  dingtalk-split-bot:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile.split
    image: dingtalk-split-bot:latest
    container_name: dingtalk-split-bot
    restart: unless-stopped
    env_file:
      - path: ./apps/split_bot/.env
        required: false
    volumes:
      - ./apps/split_bot/.bot-workspace:/app/.bot-workspace
